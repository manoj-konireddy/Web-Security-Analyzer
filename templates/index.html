{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Web Security Analyzer</h1>

    <p>
        Analyze your website security configuration and
        generate a professional security report.
    </p>

    <form method="POST">

        <input
            type="url"
            name="url"
            placeholder="https://example.com"
            value="{{ url if url else '' }}"
            required>

        <button id="scan-btn" type="submit">

            Analyze Website

        </button>

        {% if error %}

        <div class="error-message">

            ❌ {{ error }}

        </div>

        {% endif %}

        <div id="loading" class="loading">

            <div class="spinner"></div>

            <p>

                Scanning Website...

            </p>

        </div>

    </form>

</div>

{% endblock %}
